<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學程規劃表 · 四年課表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFEBE1;
    --paper-dark:#E4DECF;
    --card:#FBF9F3;
    --ink:#1E2A38;
    --ink-soft:#5B6472;
    --hairline:#CBC2A9;
    --maroon:#7A2E2E;
    --brass:#B08D3F;
    --navy:#3B5170;
    --teal:#2F6F6C;
    --purple:#5B4B8A;
    --green:#3F6B4A;
    --grey:#6B6558;
    --danger:#A5342C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;flex-direction:column;
  }
  ::selection{background:var(--brass);color:#fff;}
  h1,h2,h3{font-family:'Source Serif 4',serif;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ===== Header ===== */
  .topbar{
    display:flex;align-items:center;gap:28px;
    padding:22px 32px;
    background:var(--card);
    border-bottom:2px solid var(--ink);
    flex:0 0 auto;
  }
  .seal{
    position:relative;width:76px;height:76px;flex:0 0 auto;
  }
  .seal svg{transform:rotate(-90deg);}
  .seal .center{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .seal .pct{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;color:var(--maroon);}
  .seal .pct-label{font-size:8px;letter-spacing:.12em;color:var(--ink-soft);text-transform:uppercase;margin-top:1px;}
  .title-block h1{font-size:22px;letter-spacing:.01em;}
  .title-block .sub{font-size:12px;color:var(--ink-soft);margin-top:3px;letter-spacing:.02em;}
  .ledger{
    margin-left:auto;display:flex;gap:0;border:1px solid var(--hairline);border-radius:2px;overflow:hidden;
  }
  .ledger .cell{
    padding:8px 18px;text-align:center;border-left:1px solid var(--hairline);
  }
  .ledger .cell:first-child{border-left:none;}
  .ledger .num{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:18px;}
  .ledger .lab{font-size:10px;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}
  .ledger .warn .num{color:var(--danger);}
  .ledger .ok .num{color:var(--green);}

  .file-actions{display:flex;gap:8px;flex:0 0 auto;}
  .file-actions .btn-small{white-space:nowrap;}

  /* ===== Layout ===== */
  .layout{
    display:grid;grid-template-columns:340px 1fr;gap:0;
    flex:1 1 auto;min-height:0;
  }
  @media (max-width:900px){
    .layout{grid-template-columns:1fr;flex:none;min-height:0;}
    .sidebar,.main{height:auto !important;overflow:visible !important;}
  }

  .sidebar{
    padding:24px;border-right:2px solid var(--ink);
    background:var(--paper-dark);
    height:100%;overflow-y:auto;
  }
  .main{padding:24px 28px;height:100%;overflow-y:auto;}

  .section-label{
    font-family:'Source Serif 4',serif;font-size:15px;font-weight:600;
    display:flex;align-items:center;gap:8px;margin:0 0 12px 0;color:var(--ink);
  }
  .section-label .n{
    font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--ink);color:var(--paper);
    width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }

  .card-box{
    background:var(--card);border:1px solid var(--hairline);border-radius:3px;padding:16px;margin-bottom:20px;
  }
  label{display:block;font-size:11px;color:var(--ink-soft);letter-spacing:.05em;text-transform:uppercase;margin:10px 0 4px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=number],select{
    width:100%;padding:8px 10px;border:1px solid var(--hairline);border-radius:2px;
    background:#fff;font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--brass);outline-offset:1px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  button{
    font-family:'Inter',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.03em;
    cursor:pointer;border:none;border-radius:2px;padding:9px 14px;transition:filter .15s;
  }
  button:hover{filter:brightness(1.08);}
  button:active{filter:brightness(.94);}
  .btn-primary{background:var(--maroon);color:#fff;width:100%;margin-top:12px;}
  .btn-ghost{background:transparent;border:1px solid var(--hairline);color:var(--ink);}
  .btn-small{padding:5px 9px;font-size:11px;}
  .btn-row{display:flex;gap:8px;margin-top:10px;}

  .program-item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:7px 10px;background:#fff;border:1px solid var(--hairline);border-radius:2px;margin-top:6px;font-size:12.5px;
  }
  .program-item.disabled{background:var(--paper-dark);opacity:.65;}
  .program-item .tag{
    font-size:9.5px;padding:2px 6px;border-radius:9px;color:#fff;letter-spacing:.04em;text-transform:uppercase;
  }
  .del-x{
    background:none;border:none;color:var(--ink-soft);font-size:15px;line-height:1;padding:2px 4px;
  }
  .del-x:hover{color:var(--danger);}

  /* course pool */
  .pool-group{margin-bottom:14px;}
  .pool-group-title{
    font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);
    display:flex;align-items:center;gap:6px;margin-bottom:6px;
  }
  .pool-group-title .swatch{width:8px;height:8px;border-radius:50%;}
  .chip{
    display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--hairline);
    border-left:5px solid var(--grey);border-radius:2px;padding:7px 9px;margin-bottom:6px;
    cursor:grab;user-select:none;font-size:12.5px;transition:box-shadow .15s, transform .1s;
  }
  .chip:active{cursor:grabbing;}
  .chip.selected{box-shadow:0 0 0 2px var(--brass) inset;transform:translateX(2px);}
  .chip .name{flex:1;font-weight:500;line-height:1.25;}
  .chip .sub{font-size:10px;color:var(--ink-soft);}
  .chip .credit{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);flex:0 0 auto;}
  .chip .del-x{flex:0 0 auto;}
  .empty-note{font-size:12px;color:var(--ink-soft);font-style:italic;padding:6px 2px;}
  .search-box{margin-bottom:12px;}

  /* grid of semesters */
  .grid4{
    display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,minmax(150px,auto));gap:14px;
  }
  @media (max-width:640px){ .grid4{grid-template-columns:1fr;} }
  .sem-card{
    background:var(--card);border:1px solid var(--hairline);border-radius:3px;
    display:flex;flex-direction:column;min-height:150px;
  }
  .sem-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;border-bottom:1px solid var(--hairline);background:var(--paper-dark);
    border-radius:3px 3px 0 0;
  }
  .sem-head h3{font-size:13.5px;letter-spacing:.02em;}
  .sem-head .credit-badge{
    font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--ink);color:var(--paper);
    padding:2px 8px;border-radius:9px;
  }
  .sem-body{
    flex:1;padding:10px;display:flex;flex-direction:column;gap:6px;
    transition:background .12s;
  }
  .sem-body.drag-over{background:#F4EBD0;outline:2px dashed var(--brass);outline-offset:-4px;}
  .sem-body .chip{border-left-width:5px;cursor:grab;}
  .drop-hint{font-size:11px;color:var(--ink-soft);text-align:center;padding:14px 4px;border:1.5px dashed var(--hairline);border-radius:3px;flex:1;display:flex;align-items:center;justify-content:center;}

  .pool-dropzone{
    border:1.5px dashed var(--hairline);border-radius:3px;padding:8px;min-height:40px;transition:background .12s,border-color .12s;
  }
  .pool-dropzone.drag-over{background:#F4EBD0;border-color:var(--brass);}

  /* preset course import panel */
  .preset-select{margin-bottom:10px;}
  .preset-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .preset-toolbar .link-btn{
    background:none;border:none;padding:0;font-size:11px;color:var(--navy);text-decoration:underline;font-weight:600;
  }
  .preset-list{max-height:340px;overflow-y:auto;border:1px solid var(--hairline);border-radius:2px;background:#fff;}
  .preset-group-title{
    font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;
    padding:5px 10px;position:sticky;top:0;
  }
  .preset-row{
    display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border-bottom:1px solid var(--hairline);font-size:12.5px;
  }
  .preset-row:last-child{border-bottom:none;}
  .preset-row input[type=checkbox]{margin-top:2px;flex:0 0 auto;width:auto;}
  .preset-row .p-name{font-weight:500;line-height:1.3;}
  .preset-row .p-credit{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);font-size:11px;white-space:nowrap;margin-left:auto;padding-left:6px;}
  .preset-row .p-note{font-size:10.5px;color:var(--ink-soft);font-style:italic;margin-top:1px;}
  .preset-import-count{font-size:11px;color:var(--ink-soft);margin-top:8px;}

  .footnote{font-size:11px;color:var(--ink-soft);line-height:1.6;margin-top:6px;}
  .checkbox-line{
    display:flex;align-items:center;gap:7px;margin-top:10px;
    font-size:12.5px;text-transform:none;letter-spacing:normal;color:var(--ink);cursor:pointer;
  }
  .checkbox-line input{width:auto;margin:0;}

  .req-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px;}
  .req-table td{padding:5px 2px;border-bottom:1px solid var(--hairline);}
  .req-table td:last-child{text-align:right;font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  .req-table tr.met .num-frac{color:var(--green);}
  .req-table tr.total td{border-top:2px solid var(--ink);border-bottom:none;font-weight:700;padding-top:8px;}
  .req-table .sub-label{color:var(--ink-soft);font-size:10.5px;display:block;margin-top:1px;}

  .credit-summary-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px;}
  .credit-summary-table td{padding:4px 2px;border-bottom:1px solid var(--hairline);}
  .credit-summary-table td:last-child{text-align:right;font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body>

<div class="topbar">
  <div class="seal">
    <svg width="76" height="76" viewbox="0 0 76 76">
      <circle cx="38" cy="38" r="32" fill="none" stroke="#CBC2A9" stroke-width="6"/>
      <circle id="sealRing" cx="38" cy="38" r="32" fill="none" stroke="#7A2E2E" stroke-width="6" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="201"/>
    </svg>
    <div class="center">
      <div class="pct mono" id="sealPct">0%</div>
      <div class="pct-label">已規劃</div>
    </div>
  </div>
  <div class="title-block">
    <h1>學程規劃表</h1>
    <div class="sub" id="majorSub">尚未設定科系</div>
  </div>
  <div class="ledger">
    <div class="cell"><div class="num mono" id="ledgerTotal">0</div><div class="lab">應修學分</div></div>
    <div class="cell ok"><div class="num mono" id="ledgerPlanned">0</div><div class="lab">已排學分</div></div>
    <div class="cell warn"><div class="num mono" id="ledgerRemain">0</div><div class="lab">尚需學分</div></div>
  </div>
  <div class="file-actions">
    <button class="btn-ghost btn-small" id="exportBtn" title="下載目前的排課規劃為檔案">💾 匯出規劃</button>
    <button class="btn-ghost btn-small" id="importBtn" title="讀取先前匯出的規劃檔案">📂 匯入規劃</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
  </div>
</div>

<div class="layout">
  <!-- SIDEBAR -->
  <div class="sidebar">

    <div class="section-label"><span class="n">1</span>基本資料</div>
    <div class="card-box">
      <label>主修科系</label>
      <input type="text" id="majorName" placeholder="例：資訊工程學系">
      <label class="checkbox-line">
        <input type="checkbox" id="majorDongjiCheck"> 主修動機系（依113學年課表，最低畢業學分129）
      </label>

      <label>額外身份（雙主修 / 輔系 / 學程）</label>
      <div class="row2">
        <select id="progType">
          <option value="雙主修">雙主修</option>
          <option value="輔系">輔系</option>
          <option value="學程">學程</option>
        </select>
        <input type="text" id="progName" placeholder="名稱，例：財金系">
      </div>
      <label>該身份畢業所需最低學分</label>
      <input type="number" id="progCredit" min="0" step="1" placeholder="例：20" value="20">
      <button class="btn-ghost" style="width:100%;margin-top:8px;" id="addProgramBtn">＋ 新增身份</button>
      <div id="programList"></div>
    </div>

    <div class="section-label"><span class="n">2</span>常用課表匯入</div>
    <div class="card-box">
      <label>選擇系所課表範本</label>
      <select id="presetSelect" class="preset-select">
        <option value="">— 請選擇 —</option>
      </select>
      <div id="presetPanel" style="display:none;">
        <div class="preset-toolbar">
          <span class="footnote" style="margin:0;" id="presetHint"></span>
          <button class="link-btn" id="presetToggleAll">全選 / 取消全選</button>
        </div>
        <div class="preset-list" id="presetList"></div>
        <button class="btn-primary" id="presetImportBtn">＋ 加入勾選課程至待排清單</button>
        <div class="preset-import-count" id="presetImportMsg"></div>
      </div>
    </div>

    <div class="section-label"><span class="n">3</span>新增課程</div>
    <div class="card-box">
      <label>課程名稱</label>
      <input type="text" id="courseName" placeholder="例：資料結構">
      <div class="row2">
        <div>
          <label>學分數</label>
          <input type="number" id="courseCredit" min="0" step="0.5" placeholder="3">
        </div>
        <div>
          <label>課程類別</label>
          <select id="courseCategory">
            <option value="主修必修">主修必修</option>
            <option value="主修選修">主修選修</option>
            <option value="校定必修">校定必修</option>
            <option value="通識">通識</option>
            <option value="專業學程">專業學程</option>
            <option value="雙主修">雙主修</option>
            <option value="輔系">輔系</option>
            <option value="學程">學程</option>
            <option value="其他">其他</option>
          </select>
        </div>
      </div>
      <label id="progSelectLabel" style="display:none;">所屬身份</label>
      <select id="courseProgram" style="display:none;"></select>
      <button class="btn-primary" id="addCourseBtn">＋ 加入待排課程</button>
    </div>

    <div class="section-label"><span class="n">4</span>待排課程池</div>
    <input type="text" class="search-box" id="searchCourse" placeholder="搜尋課程名稱…" style="padding:8px 10px;border:1px solid var(--hairline);border-radius:2px;width:100%;font-size:12.5px;">
    <div class="pool-dropzone" id="poolZone">
      <div id="poolContainer"></div>
    </div>
    <div class="footnote">💡 拖曳課程卡片到右側學期表格，或先點選卡片、再點選目標學期格子。</div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="section-label"><span class="n">5</span>四年課表（拖曳課程至對應學期）</div>
    <div class="grid4" id="semesterGrid"></div>

    <div class="section-label" style="margin-top:24px;"><span class="n">6</span>學分統計</div>
    <div class="card-box" style="max-width:420px;">
      <table class="credit-summary-table" id="summaryTable"></table>
    </div>
  </div>
</div>

<script>
/* ================= DATA ================= */
const CATEGORY_COLORS = {
  '主修必修':'#7A2E2E', '主修選修':'#B08D3F', '通識':'#3B5170',
  '校定必修':'#9C5B3C', '專業學程':'#4A6FA1',
  '雙主修':'#2F6F6C', '輔系':'#5B4B8A', '學程':'#3F6B4A', '其他':'#6B6558'
};
const PROGRAM_CATEGORIES = ['雙主修','輔系','學程'];

/* 畢業學分需求：依各系課表訂定的最低畢業學分與各細項學分，match用來判斷哪些已加入的課程算入該項 */
const MAJOR_REQUIREMENTS = {
  dongji113: {
    label:'動機工程學系 113學年入學',
    total:129,
    items:[
      {label:'大學中文', target:2, match:c=>c.category==='校定必修' && c.name.includes('中文')},
      {label:'英文', target:8, match:c=>c.category==='校定必修' && c.name.includes('英文')},
      {label:'通識課程', target:20, match:c=>c.category==='通識'},
      {label:'系定必修', target:64, match:c=>c.category==='主修必修'},
      {label:'專業學程', target:15, match:c=>c.category==='專業學程'},
      {label:'其餘選修', target:20, match:c=>c.category==='主修選修'},
    ]
  }
};

/* 常用課表範本：依 113 學年度課程規劃表整理，學分數如標示範圍請依實際規定調整 */
const DEPARTMENT_PRESETS = {
  dongji113: {
    label:'動機工程學系 113學年入學必修課表',
    groups:[
      { title:'校定必修', items:[
        {name:'大學中文', credit:2, category:'校定必修'},
        {name:'英文一', credit:2, category:'校定必修', note:'通過本校英語能力檢定考試者，得免修選讀'},
        {name:'英文二', credit:2, category:'校定必修', note:'通過本校英語能力檢定考試者，得免修選讀'},
        {name:'英文三', credit:2, category:'校定必修', note:'通過本校英語能力檢定考試者，得免修選讀'},
        {name:'英文四', credit:2, category:'校定必修', note:'通過本校英語能力檢定考試者，得免修選讀'},
        {name:'通識核心必修', credit:8, category:'通識', note:'範圍8-12學分，需於四個不同核心向度中至少各選一門，且至少修畢四門核心課程'},
        {name:'通識選修科目', credit:8, category:'通識', note:'範圍8-12學分，自由選修'},
      ]},
      { title:'系定必修', items:[
        {name:'微積分一', credit:3, category:'主修必修'},
        {name:'微積分二', credit:3, category:'主修必修'},
        {name:'工程數學一', credit:3, category:'主修必修'},
        {name:'工程數學二', credit:3, category:'主修必修'},
        {name:'基礎熱流學一', credit:3, category:'主修必修'},
        {name:'基礎熱流學二', credit:3, category:'主修必修'},
        {name:'應用力學一', credit:2, category:'主修必修'},
        {name:'應用力學二', credit:2, category:'主修必修'},
        {name:'專題研究一', credit:1, category:'主修必修'},
        {name:'專題研究二', credit:2, category:'主修必修'},
        {name:'固體力學與奈米材料實驗', credit:1, category:'主修必修'},
        {name:'熱流與動力系統實驗', credit:1, category:'主修必修'},
        {name:'普通化學乙', credit:3, category:'主修必修'},
        {name:'普通化學實驗', credit:1, category:'主修必修'},
        {name:'程式設計', credit:3, category:'主修必修'},
        {name:'工程導論', credit:2, category:'主修必修'},
        {name:'工程圖學', credit:2, category:'主修必修'},
        {name:'工場實習', credit:1, category:'主修必修'},
        {name:'電路學', credit:3, category:'主修必修'},
        {name:'電子學一', credit:3, category:'主修必修'},
        {name:'電子電路實驗一', credit:1, category:'主修必修'},
        {name:'材料力學', credit:3, category:'主修必修'},
        {name:'機械製造', credit:3, category:'主修必修'},
        {name:'機械設計', credit:3, category:'主修必修'},
        {name:'材料科學導論', credit:3, category:'主修必修'},
      ]},
      { title:'物理相關課程（五選二，各3學分，優先推薦前三項）', items:[
        {name:'工程光學', credit:3, category:'主修必修', note:'優先推薦'},
        {name:'電磁學', credit:3, category:'主修必修', note:'優先推薦；可雙重認證系定必修與專業學程'},
        {name:'近代物理導論', credit:3, category:'主修必修', note:'優先推薦；可雙重認證系定必修與專業學程'},
        {name:'普通物理一', credit:3, category:'主修必修'},
        {name:'普通物理二', credit:3, category:'主修必修'},
      ]},
      { title:'專業學程與選修', items:[
        {name:'專業學程（電控/奈微米/能源/精密機械與智慧製造，擇一修滿）', credit:15, category:'專業學程', note:'需選修至少5門學程內課程（核心必選3門＋選修2門以上）'},
        {name:'其餘選修', credit:20, category:'主修選修', note:'建議選修「邏輯思考與運算」相關課程'},
      ]},
    ]
  }
};

const SEMESTERS = [
  {id:'y1s1', year:'大一', term:'上學期'}, {id:'y1s2', year:'大一', term:'下學期'},
  {id:'y2s1', year:'大二', term:'上學期'}, {id:'y2s2', year:'大二', term:'下學期'},
  {id:'y3s1', year:'大三', term:'上學期'}, {id:'y3s2', year:'大三', term:'下學期'},
  {id:'y4s1', year:'大四', term:'上學期'}, {id:'y4s2', year:'大四', term:'下學期'},
];

let state = {
  major: '',
  majorKey: null,   // 若對應 MAJOR_REQUIREMENTS 中的預設系所，畢業學分需求以該系表為準
  programs: [],   // {id, type, name, requiredCredits}
  courses: [],    // {id, name, credit, category, programId|null, semester|null}
  selectedChip: null,
};
let uid = 1;
const newId = () => 'c' + (uid++);

/* ================= HELPERS ================= */
function programsByCategory(cat){ return state.programs.filter(p=>p.type===cat); }
function programName(pid){ const p = state.programs.find(x=>x.id===pid); return p ? p.name : ''; }

function totalCredits(){ return state.courses.reduce((s,c)=>s+Number(c.credit||0),0); }
function plannedCredits(){ return state.courses.filter(c=>c.semester).reduce((s,c)=>s+Number(c.credit||0),0); }

/* 畢業學分需求：若有勾選正式系所（majorKey），以該系表的129學分為主科底標，
   否則退回「已加入課程學分加總」讓其他系所使用者也能使用。
   額外身份（雙主修/輔系/學程）各自的所需學分會再加總進來。 */
function majorRequiredTotal(){
  if(state.majorKey && MAJOR_REQUIREMENTS[state.majorKey]) return MAJOR_REQUIREMENTS[state.majorKey].total;
  return null; // null 代表沒有正式規定，用課程加總取代
}
function programsRequiredTotal(){
  return state.programs.filter(p=>p.enabled!==false).reduce((s,p)=>s+Number(p.requiredCredits||0),0);
}
function requiredTotalCredits(){
  const majorReq = majorRequiredTotal();
  if(majorReq===null) return totalCredits(); // fallback：沒有正式系所規定時，用已加入課程學分加總
  return majorReq + programsRequiredTotal();
}

/* ================= RENDER: HEADER ================= */
function renderHeader(){
  document.getElementById('majorSub').textContent = state.major
    ? `主修：${state.major}` + (state.programs.length ? ' ｜ ' + state.programs.map(p=>`${p.type}：${p.name}`).join('、') : '')
    : '尚未設定科系';

  const total = requiredTotalCredits(), planned = plannedCredits(), remain = Math.max(total-planned,0);
  document.getElementById('ledgerTotal').textContent = total;
  document.getElementById('ledgerPlanned').textContent = planned;
  document.getElementById('ledgerRemain').textContent = remain;

  const pct = total > 0 ? Math.min(planned/total,1) : 0;
  const circumference = 201; // 2*pi*32 approx
  document.getElementById('sealRing').setAttribute('stroke-dashoffset', circumference*(1-pct));
  document.getElementById('sealPct').textContent = Math.round(pct*100) + '%';
}

/* ================= RENDER: PROGRAM LIST ================= */
function renderPrograms(){
  const el = document.getElementById('programList');
  el.innerHTML = '';
  state.programs.forEach(p=>{
    if(p.enabled === undefined) p.enabled = true;
    const div = document.createElement('div');
    div.className = 'program-item' + (p.enabled ? '' : ' disabled');
    div.innerHTML = `
      <label style="display:flex;align-items:flex-start;gap:7px;cursor:pointer;flex:1;">
        <input type="checkbox" data-pid="${p.id}" class="prog-toggle" ${p.enabled ? 'checked' : ''} style="margin-top:2px;">
        <span><span class="tag" style="background:${CATEGORY_COLORS[p.type]}">${p.type}</span> ${p.name}
          <span class="sub" style="display:block;color:var(--ink-soft);font-size:10px;margin-top:2px;">所需 ${p.requiredCredits||0} 學分${p.enabled ? '' : '（已停用，不計入畢業學分）'}</span>
        </span>
      </label>
      <button class="del-x" data-pid="${p.id}" title="刪除">✕</button>`;
    div.querySelector('.prog-toggle').addEventListener('change', e=>{
      p.enabled = e.target.checked;
      renderAll();
    });
    div.querySelector('.del-x').addEventListener('click', ()=>{
      state.programs = state.programs.filter(x=>x.id!==p.id);
      // detach courses tied to this program (keep course, clear link) or remove entirely? remove entirely since they belong to this identity
      state.courses = state.courses.filter(c=>c.programId!==p.id);
      renderAll();
    });
    el.appendChild(div);
  });
  // refresh course-program select
  const catSel = document.getElementById('courseCategory').value;
  refreshProgramSelect(catSel);
}

function refreshProgramSelect(cat){
  const wrap = document.getElementById('courseProgram');
  const label = document.getElementById('progSelectLabel');
  if(PROGRAM_CATEGORIES.includes(cat)){
    const list = programsByCategory(cat);
    wrap.style.display = 'block'; label.style.display='block';
    wrap.innerHTML = list.length
      ? list.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')
      : `<option value="">請先於上方新增「${cat}」身份</option>`;
  } else {
    wrap.style.display = 'none'; label.style.display='none';
  }
}

/* ================= PRESET COURSE IMPORT ================= */
function populatePresetSelect(){
  const sel = document.getElementById('presetSelect');
  Object.keys(DEPARTMENT_PRESETS).forEach(key=>{
    const opt = document.createElement('option');
    opt.value = key; opt.textContent = DEPARTMENT_PRESETS[key].label;
    sel.appendChild(opt);
  });
}

function renderPresetPanel(){
  const key = document.getElementById('presetSelect').value;
  const panel = document.getElementById('presetPanel');
  const list = document.getElementById('presetList');
  document.getElementById('presetImportMsg').textContent = '';
  if(!key){ panel.style.display='none'; return; }
  panel.style.display = 'block';
  const preset = DEPARTMENT_PRESETS[key];
  document.getElementById('presetHint').textContent = `共 ${preset.groups.reduce((s,g)=>s+g.items.length,0)} 門課程，勾選後可批次加入`;
  list.innerHTML = '';
  preset.groups.forEach((group, gi)=>{
    const gTitle = document.createElement('div');
    gTitle.className = 'preset-group-title';
    gTitle.style.background = CATEGORY_COLORS[group.items[0].category] || '#6B6558';
    gTitle.textContent = group.title;
    list.appendChild(gTitle);
    group.items.forEach((item, ii)=>{
      const row = document.createElement('label');
      row.className = 'preset-row';
      const already = state.courses.some(c=>c.name===item.name);
      row.innerHTML = `
        <input type="checkbox" data-gi="${gi}" data-ii="${ii}" ${already?'disabled':''}>
        <div style="flex:1;">
          <div class="p-name">${item.name}${already?'　<span style="color:var(--ink-soft);font-weight:400;">（已在清單中）</span>':''}</div>
          ${item.note ? `<div class="p-note">${item.note}</div>` : ''}
        </div>
        <div class="p-credit">${item.credit} 學分</div>`;
      list.appendChild(row);
    });
  });
}

function setupPresetEvents(){
  document.getElementById('presetSelect').addEventListener('change', renderPresetPanel);

  document.getElementById('presetToggleAll').addEventListener('click', ()=>{
    const boxes = [...document.querySelectorAll('#presetList input[type=checkbox]:not(:disabled)')];
    const allChecked = boxes.every(b=>b.checked);
    boxes.forEach(b=> b.checked = !allChecked);
  });

  document.getElementById('presetImportBtn').addEventListener('click', ()=>{
    const key = document.getElementById('presetSelect').value;
    if(!key) return;
    const preset = DEPARTMENT_PRESETS[key];
    const boxes = [...document.querySelectorAll('#presetList input[type=checkbox]:checked:not(:disabled)')];
    let added = 0;
    boxes.forEach(b=>{
      const item = preset.groups[b.dataset.gi].items[b.dataset.ii];
      if(state.courses.some(c=>c.name===item.name)) return; // safety dedupe
      state.courses.push({ id:newId(), name:item.name, credit:item.credit, category:item.category, programId:null, semester:null });
      added++;
    });
    document.getElementById('presetImportMsg').textContent = added>0 ? `已加入 ${added} 門課程至待排清單。` : '請先勾選要加入的課程。';
    renderAll();
    renderPresetPanel(); // refresh disabled state for already-added items
  });
}

/* ================= RENDER: COURSE POOL ================= */
function renderPool(){
  const container = document.getElementById('poolContainer');
  container.innerHTML = '';
  const search = document.getElementById('searchCourse').value.trim().toLowerCase();
  const unassigned = state.courses.filter(c=>!c.semester && (!search || c.name.toLowerCase().includes(search)));

  if(unassigned.length===0){
    container.innerHTML = '<div class="empty-note">目前沒有待排課程。</div>';
    return;
  }
  const groups = {};
  unassigned.forEach(c=>{ (groups[c.category] = groups[c.category]||[]).push(c); });

  Object.keys(groups).forEach(cat=>{
    const g = document.createElement('div');
    g.className = 'pool-group';
    g.innerHTML = `<div class="pool-group-title"><span class="swatch" style="background:${CATEGORY_COLORS[cat]}"></span>${cat}</div>`;
    groups[cat].forEach(c=> g.appendChild(makeChip(c)) );
    container.appendChild(g);
  });
}

function makeChip(course){
  const chip = document.createElement('div');
  chip.className = 'chip' + (state.selectedChip===course.id ? ' selected' : '');
  chip.draggable = true;
  chip.dataset.id = course.id;
  chip.style.borderLeftColor = CATEGORY_COLORS[course.category] || '#6B6558';
  const subText = course.programId ? programName(course.programId) : course.category;
  const isScheduled = !!course.semester;
  const removeIcon = isScheduled ? '↩' : '✕';
  const removeTitle = isScheduled ? '移回待排課程池' : '刪除課程';
  chip.innerHTML = `
    <div class="name">${course.name}<div class="sub">${subText}</div></div>
    <div class="credit mono">${course.credit} 學分</div>
    <button class="del-x" title="${removeTitle}">${removeIcon}</button>`;

  chip.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', course.id); });
  chip.addEventListener('click', (e)=>{
    if(e.target.classList.contains('del-x')) return;
    state.selectedChip = (state.selectedChip===course.id) ? null : course.id;
    renderAll();
  });
  chip.querySelector('.del-x').addEventListener('click', (e)=>{
    e.stopPropagation();
    if(isScheduled){
      // 已排入學期的課程：移回待排課程池，不直接刪除
      course.semester = null;
    } else {
      // 待排課程池中的課程：直接刪除
      state.courses = state.courses.filter(c=>c.id!==course.id);
    }
    if(state.selectedChip===course.id) state.selectedChip=null;
    renderAll();
  });
  return chip;
}

/* ================= RENDER: SEMESTER GRID ================= */
function renderGrid(){
  const grid = document.getElementById('semesterGrid');
  grid.innerHTML = '';
  SEMESTERS.forEach(sem=>{
    const card = document.createElement('div');
    card.className = 'sem-card';
    const inSem = state.courses.filter(c=>c.semester===sem.id);
    const credit = inSem.reduce((s,c)=>s+Number(c.credit||0),0);

    card.innerHTML = `
      <div class="sem-head"><h3>${sem.year}．${sem.term}</h3><div class="credit-badge mono">${credit} 學分</div></div>
      <div class="sem-body" data-sem="${sem.id}"></div>`;

    const body = card.querySelector('.sem-body');
    if(inSem.length===0){
      body.innerHTML = '<div class="drop-hint">拖曳或點選課程至此</div>';
    } else {
      inSem.forEach(c=>body.appendChild(makeChip(c)));
    }

    body.addEventListener('dragover', e=>{ e.preventDefault(); body.classList.add('drag-over'); });
    body.addEventListener('dragleave', ()=> body.classList.remove('drag-over'));
    body.addEventListener('drop', e=>{
      e.preventDefault(); body.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      assignCourse(id, sem.id);
    });
    body.addEventListener('click', ()=>{
      if(state.selectedChip){
        assignCourse(state.selectedChip, sem.id);
        state.selectedChip = null;
      }
    });
    grid.appendChild(card);
  });
}

function assignCourse(id, semId){
  const c = state.courses.find(x=>x.id===id);
  if(!c) return;
  c.semester = semId;
  renderAll();
}

/* pool as drop target (unassign) */
function setupPoolDrop(){
  const zone = document.getElementById('poolZone');
  zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', ()=> zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e=>{
    e.preventDefault(); zone.classList.remove('drag-over');
    const id = e.dataTransfer.getData('text/plain');
    const c = state.courses.find(x=>x.id===id);
    if(c){ c.semester = null; renderAll(); }
  });
  zone.addEventListener('click', (e)=>{
    if(e.target.closest('.chip')) return;
    if(state.selectedChip){
      const c = state.courses.find(x=>x.id===state.selectedChip);
      if(c){ c.semester = null; }
      state.selectedChip = null;
      renderAll();
    }
  });
}

/* ================= RENDER: SUMMARY TABLE ================= */
function renderSummary(){
  const table = document.getElementById('summaryTable');
  const req = state.majorKey ? MAJOR_REQUIREMENTS[state.majorKey] : null;

  if(!req){
    // 沒有設定正式系所：退回依課程類別加總顯示
    table.className = 'credit-summary-table';
    const cats = [...new Set(state.courses.map(c=>c.category))];
    let rows = '';
    cats.forEach(cat=>{
      const list = state.courses.filter(c=>c.category===cat);
      const total = list.reduce((s,c)=>s+Number(c.credit||0),0);
      const planned = list.filter(c=>c.semester).reduce((s,c)=>s+Number(c.credit||0),0);
      rows += `<tr><td>${cat}</td><td>${planned} / ${total} 學分</td></tr>`;
    });
    if(!rows) rows = '<tr><td colspan="2" style="color:var(--ink-soft);font-style:italic;">尚未新增課程</td></tr>';
    table.innerHTML = rows;
    return;
  }

  // 有設定正式系所：依畢業學分需求逐項顯示（已排學分 / 應修學分）
  table.className = 'req-table';
  let rows = `<tr><td colspan="2" style="font-weight:700;color:var(--maroon);">${req.label}</td></tr>`;
  req.items.forEach(item=>{
    const matched = state.courses.filter(item.match);
    const planned = matched.filter(c=>c.semester).reduce((s,c)=>s+Number(c.credit||0),0);
    const met = planned >= item.target;
    rows += `<tr class="${met?'met':''}"><td>${item.label}</td><td><span class="num-frac">${planned} / ${item.target}</span> 學分</td></tr>`;
  });
  const majorPlanned = state.courses.filter(c=>req.items.some(it=>it.match(c))).filter(c=>c.semester).reduce((s,c)=>s+Number(c.credit||0),0);
  rows += `<tr class="total"><td>主修小計</td><td>${majorPlanned} / ${req.total} 學分</td></tr>`;

  state.programs.forEach(p=>{
    const list = state.courses.filter(c=>c.programId===p.id);
    const planned = list.filter(c=>c.semester).reduce((s,c)=>s+Number(c.credit||0),0);
    const disabledNote = p.enabled===false ? '（已停用）' : '';
    rows += `<tr${p.enabled===false ? ' style="color:var(--ink-soft);font-style:italic;"' : ''}><td>${p.type}：${p.name}${disabledNote}</td><td>${planned} / ${p.requiredCredits||0} 學分</td></tr>`;
  });

  rows += `<tr class="total"><td>畢業總計</td><td>${plannedCredits()} / ${requiredTotalCredits()} 學分</td></tr>`;
  table.innerHTML = rows;
}

/* ================= MASTER RENDER ================= */
function renderAll(){
  renderHeader();
  renderPrograms();
  renderPool();
  renderGrid();
  renderSummary();
}

/* ================= EVENTS: FORMS ================= */
document.getElementById('majorName').addEventListener('input', e=>{
  state.major = e.target.value; renderHeader();
});

document.getElementById('majorDongjiCheck').addEventListener('change', e=>{
  if(e.target.checked){
    state.majorKey = 'dongji113';
    if(!document.getElementById('majorName').value.trim()){
      document.getElementById('majorName').value = '動機工程學系';
      state.major = '動機工程學系';
    }
  } else {
    state.majorKey = null;
  }
  renderAll();
});

document.getElementById('addProgramBtn').addEventListener('click', ()=>{
  const type = document.getElementById('progType').value;
  const nameInput = document.getElementById('progName');
  const creditInput = document.getElementById('progCredit');
  const name = nameInput.value.trim();
  if(!name){ nameInput.focus(); return; }
  const requiredCredits = parseFloat(creditInput.value) || 0;
  state.programs.push({id:'p'+(uid++), type, name, requiredCredits, enabled:true});
  nameInput.value = ''; creditInput.value = '20';
  renderAll();
});

document.getElementById('courseCategory').addEventListener('change', e=>{
  refreshProgramSelect(e.target.value);
});

document.getElementById('addCourseBtn').addEventListener('click', ()=>{
  const nameEl = document.getElementById('courseName');
  const creditEl = document.getElementById('courseCredit');
  const catEl = document.getElementById('courseCategory');
  const progEl = document.getElementById('courseProgram');

  const name = nameEl.value.trim();
  const credit = parseFloat(creditEl.value);
  const category = catEl.value;

  if(!name){ nameEl.focus(); return; }
  if(isNaN(credit) || credit<0){ creditEl.focus(); return; }

  let programId = null;
  if(PROGRAM_CATEGORIES.includes(category)){
    if(!progEl.value){ alert(`請先新增並選擇「${category}」身份`); return; }
    programId = progEl.value;
  }

  state.courses.push({ id:newId(), name, credit, category, programId, semester:null });
  nameEl.value=''; creditEl.value='';
  nameEl.focus();
  renderAll();
});

document.getElementById('searchCourse').addEventListener('input', renderPool);

/* enter-key convenience */
['courseName','courseCredit'].forEach(id=>{
  document.getElementById(id).addEventListener('keydown', e=>{
    if(e.key==='Enter') document.getElementById('addCourseBtn').click();
  });
});
document.getElementById('progName').addEventListener('keydown', e=>{
  if(e.key==='Enter') document.getElementById('addProgramBtn').click();
});

/* ================= EXPORT / IMPORT PLAN ================= */
function exportPlan(){
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    major: state.major,
    majorKey: state.majorKey,
    programs: state.programs,
    courses: state.courses,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const datePart = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `課表規劃_${state.major || '未命名'}_${datePart}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importPlan(file){
  const reader = new FileReader();
  reader.onload = e => {
    let data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ alert('這個檔案不是有效的規劃檔（JSON 格式錯誤）。'); return; }

    if(!data || !Array.isArray(data.courses) || !Array.isArray(data.programs)){
      alert('這個檔案的格式看起來不是本網站匯出的規劃檔。');
      return;
    }
    if(state.courses.length > 0 || state.programs.length > 0){
      const ok = confirm('讀取這個檔案會覆蓋目前畫面上的所有課程與身份設定，確定要繼續嗎？');
      if(!ok) return;
    }

    state.major = data.major || '';
    state.majorKey = data.majorKey || null;
    state.programs = data.programs.map(p=>({ enabled:true, requiredCredits:0, ...p }));
    state.courses = data.courses.map(c=>({ semester:null, programId:null, ...c }));
    state.selectedChip = null;

    // 重新設定uid計數器，避免之後新增的課程/身份與匯入的ID重複
    let maxNum = 0;
    [...state.programs, ...state.courses].forEach(item=>{
      const m = String(item.id||'').match(/(\d+)$/);
      if(m) maxNum = Math.max(maxNum, parseInt(m[1],10));
    });
    uid = maxNum + 1;

    document.getElementById('majorName').value = state.major;
    document.getElementById('majorDongjiCheck').checked = (state.majorKey === 'dongji113');

    renderAll();
  };
  reader.readAsText(file);
}

document.getElementById('exportBtn').addEventListener('click', exportPlan);
document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e=>{
  if(e.target.files && e.target.files[0]) importPlan(e.target.files[0]);
  e.target.value = ''; // 允許重複選取同一個檔案
});

/* ================= INIT ================= */
setupPoolDrop();
populatePresetSelect();
setupPresetEvents();
renderAll();
</script>
