<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學程規劃表 · 四年課表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFEBE1;
    --paper-dark:#E4DECF;
    --card:#FBF9F3;
    --ink:#1E2A38;
    --ink-soft:#5B6472;
    --hairline:#CBC2A9;
    --maroon:#7A2E2E;
    --brass:#B08D3F;
    --navy:#3B5170;
    --teal:#2F6F6C;
    --purple:#5B4B8A;
    --green:#3F6B4A;
    --grey:#6B6558;
    --danger:#A5342C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;flex-direction:column;
  }
  ::selection{background:var(--brass);color:#fff;}
  h1,h2,h3{font-family:'Source Serif 4',serif;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ===== Header ===== */
  .topbar{
    display:flex;align-items:center;gap:28px;
    padding:22px 32px;
    background:var(--card);
    border-bottom:2px solid var(--ink);
    flex:0 0 auto;
  }
  .seal{
    position:relative;width:76px;height:76px;flex:0 0 auto;
  }
  .seal svg{transform:rotate(-90deg);}
  .seal .center{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .seal .pct{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;color:var(--maroon);}
  .seal .pct-label{font-size:8px;letter-spacing:.12em;color:var(--ink-soft);text-transform:uppercase;margin-top:1px;}
  .title-block h1{font-size:22px;letter-spacing:.01em;}
  .title-block .sub{font-size:12px;color:var(--ink-soft);margin-top:3px;letter-spacing:.02em;}
  .ledger{
    margin-left:auto;display:flex;gap:0;border:1px solid var(--hairline);border-radius:2px;overflow:hidden;
  }
  .ledger .cell{
    padding:8px 18px;text-align:center;border-left:1px solid var(--hairline);
  }
  .ledger .cell:first-child{border-left:none;}
  .ledger .num{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:18px;}
  .ledger .lab{font-size:10px;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}
  .ledger .warn .num{color:var(--danger);}
  .ledger .ok .num{color:var(--green);}

  .file-actions{display:flex;gap:8px;flex:0 0 auto;}
  .file-actions .btn-small{white-space:nowrap;}

  /* ===== Layout ===== */
  .layout{
    display:grid;grid-template-columns:340px 1fr;gap:0;
    flex:1 1 auto;min-height:0;
  }
  @media (max-width:900px){
    .layout{grid-template-columns:1fr;flex:none;min-height:0;}
    .sidebar,.main{height:auto !important;overflow:visible !important;}
  }

  .sidebar{
    padding:24px;border-right:2px solid var(--ink);
    background:var(--paper-dark);
    height:100%;overflow-y:auto;
  }
  .main{padding:24px 28px;height:100%;overflow-y:auto;}

  .section-label{
    font-family:'Source Serif 4',serif;font-size:15px;font-weight:600;
    display:flex;align-items:center;gap:8px;margin:0 0 12px 0;color:var(--ink);
  }
  .section-label .n{
    font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--ink);color:var(--paper);
    width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }

  .card-box{
    background:var(--card);border:1px solid var(--hairline);border-radius:3px;padding:16px;margin-bottom:20px;
  }
  label{display:block;font-size:11px;color:var(--ink-soft);letter-spacing:.05em;text-transform:uppercase;margin:10px 0 4px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=number],select{
    width:100%;padding:8px 10px;border:1px solid var(--hairline);border-radius:2px;
    background:#fff;font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--brass);outline-offset:1px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  button{
    font-family:'Inter',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.03em;
    cursor:pointer;border:none;border-radius:2px;padding:9px 14px;transition:filter .15s;
  }
  button:hover{filter:brightness(1.08);}
  button:active{filter:brightness(.94);}
  .btn-primary{background:var(--maroon);color:#fff;width:100%;margin-top:12px;}
  .btn-ghost{background:transparent;border:1px solid var(--hairline);color:var(--ink);}
  .btn-small{padding:5px 9px;font-size:11px;}
  .btn-row{display:flex;gap:8px;margin-top:10px;}

  .program-item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:7px 10px;background:#fff;border:1px solid var(--hairline);border-radius:2px;margin-top:6px;font-size:12.5px;
  }
  .program-item.disabled{background:var(--paper-dark);opacity:.65;}
  .program-item .tag{
    font-size:9.5px;padding:2px 6px;border-radius:9px;color:#fff;letter-spacing:.04em;text-transform:uppercase;
  }
  .del-x{
    background:none;border:none;color:var(--ink-soft);font-size:15px;line-height:1;padding:2px 4px;
  }
  .del-x:hover{color:var(--danger);}

  /* course pool */
  .pool-group{margin-bottom:14px;}
  .pool-group-title{
    font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);
    display:flex;align-items:center;gap:6px;margin-bottom:6px;
  }
  .pool-group-title .swatch{width:8px;height:8px;border-radius:50%;}
  .chip{
    display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--hairline);
    border-left:5px solid var(--grey);border-radius:2px;padding:7px 9px;margin-bottom:6px;
    cursor:grab;user-select:none;font-size:12.5px;transition:box-shadow .15s, transform .1s;
  }
  .chip:active{cursor:grabbing;}
  .chip.selected{box-shadow:0 0 0 2px var(--brass) inset;transform:translateX(2px);}
  .chip .name{flex:1;font-weight:500;line-height:1.25;}
  .chip .sub{font-size:10px;color:var(--ink-soft);}
  .chip .credit{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);flex:0 0 auto;}
  .chip .del-x{flex:0 0 auto;}
  .empty-note{font-size:12px;color:var(--ink-soft);font-style:italic;padding:6px 2px;}
  .search-box{margin-bottom:12px;}

  /* grid of semesters */
  .grid4{
    display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,minmax(150px,auto));gap:14px;
  }
  @media (max-width:640px){ .grid4{grid-template-columns:1fr;} }
  .sem-card{
    background:var(--card);border:1px solid var(--hairline);border-radius:3px;
    display:flex;flex-direction:column;min-height:150px;
  }
  .sem-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;border-bottom:1px solid var(--hairline);background:var(--paper-dark);
    border-radius:3px 3px 0 0;
  }
  .sem-head h3{font-size:13.5px;letter-spacing:.02em;}
  .sem-head .credit-badge{
    font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--ink);color:var(--paper);
    padding:2px 8px;border-radius:9px;
  }
  .sem-body{
    flex:1;padding:10px;display:flex;flex-direction:column;gap:6px;
    transition:background .12s;
  }
  .sem-body.drag-over{background:#F4EBD0;outline:2px dashed var(--brass);outline-offset:-4px;}
  .sem-body .chip{border-left-width:5px;cursor:grab;}
  .drop-hint{font-size:11px;color:var(--ink-soft);text-align:center;padding:14px 4px;border:1.5px dashed var(--hairline);border-radius:3px;flex:1;display:flex;align-items:center;justify-content:center;}

  .pool-dropzone{
    border:1.5px dashed var(--hairline);border-radius:3px;padding:8px;min-height:40px;transition:background .12s,border-color .12s;
  }
  .pool-dropzone.drag-over{background:#F4EBD0;border-color:var(--brass);}

  /* preset course import panel */
  .preset-select{margin-bottom:10px;}
  .preset-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .preset-toolbar .link-btn{
    background:none;border:none;padding:0;font-size:11px;color:var(--navy);text-decoration:underline;font-weight:600;
  }
  .preset-list{max-height:340px;overflow-y:auto;border:1px solid var(--hairline);border-radius:2px;background:#fff;}
  .preset-group-title{
    font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;
    padding:5px 10px;position:sticky;top:0;
  }
  .preset-row{
    display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border-bottom:1px solid var(--hairline);font-size:12.5px;
  }
  .preset-row:last-child{border-bottom:none;}
  .preset-row input[type=checkbox]{margin-top:2px;flex:0 0 auto;width:auto;}
  .preset-row .p-name{font-weight:500;line-height:1.3;}
  .preset-row .p-credit{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);font-size:11px;white-space:nowrap;margin-left:auto;padding-left:6px;}
  .preset-row .p-note{font-size:10.5px;color:var(--ink-soft);font-style:italic;margin-top:1px;}
  .preset-import-count{font-size:11px;color:var(--ink-soft);margin-top:8px;}

  .footnote{font-size:11px;color:var(--ink-soft);line-height:1.6;margin-top:6px;}
  .checkbox-line{
    display:flex;align-items:center;gap:7px;margin-top:10px;
    font-size:12.5px;text-transform:none;letter-spacing:normal;color:var(--ink);cursor:pointer;
  }
  .checkbox-line input{width:auto;margin:0;}

  .req-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px;}
  .req-table td{padding:5px 2px;border-bottom:1px solid var(--hairline);}
  .req-table td:last-child{text-align:right;font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  .req-table tr.met .num-frac{color:var(--green);}
  .req-table tr.total td{border-top:2px solid var(--ink);border-bottom:none;font-weight:700;padding-top:8px;}
  .req-table .sub-label{color:var(--ink-soft);font-size:10.5px;display:block;margin-top:1px;}

  /* graduation panel */
  .grad-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--ink);margin-bottom:10px;}
  .grad-head .gh-title{font-family:'Source Serif 4',serif;font-weight:600;font-size:14px;}
  .grad-head .gh-total{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .grad-block{margin-bottom:12px;}
  .grad-block-title{
    display:flex;align-items:center;justify-content:space-between;
    font-size:11.5px;font-weight:700;letter-spacing:.05em;color:#fff;padding:4px 9px;border-radius:2px;
  }
  .grad-row{display:flex;align-items:baseline;gap:8px;padding:5px 9px;border-bottom:1px solid var(--hairline);font-size:12.5px;}
  .grad-row:last-child{border-bottom:none;}
  .grad-row .gr-name{flex:1;}
  .grad-row .gr-note{display:block;font-size:10.5px;color:var(--ink-soft);font-style:italic;margin-top:1px;}
  .grad-row .gr-num{font-family:'IBM Plex Mono',monospace;font-size:12px;white-space:nowrap;}
  .grad-row.met .gr-num{color:var(--green);font-weight:600;}
  .grad-row.sub{background:var(--paper-dark);font-weight:600;}
  .bar{height:4px;background:var(--paper-dark);border-radius:2px;overflow:hidden;width:70px;flex:0 0 auto;}
  .bar span{display:block;height:100%;background:var(--brass);}
  .bar span.full{background:var(--green);}

  /* 摺疊：計入本項的課程清單 */
  .course-detail{margin:0 0 6px 9px;font-size:11.5px;}
  .course-detail summary{
    cursor:pointer;color:var(--navy);font-size:10.5px;letter-spacing:.02em;
    padding:3px 0;list-style:none;user-select:none;
  }
  .course-detail summary::-webkit-details-marker{display:none;}
  .course-detail summary::before{content:'▸ ';font-size:9px;}
  .course-detail[open] summary::before{content:'▾ ';}
  .course-detail summary:hover{text-decoration:underline;}
  .cd-row{
    display:flex;justify-content:space-between;gap:10px;align-items:baseline;
    padding:3px 8px;border-left:2px solid var(--hairline);
  }
  .cd-name{flex:1;line-height:1.4;}
  .cd-num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);white-space:nowrap;}
  .cd-tag{
    display:inline-block;font-size:9.5px;padding:1px 5px;margin-left:5px;border-radius:8px;
    background:var(--paper-dark);color:var(--ink-soft);
  }
  .cd-tag.dual{background:var(--brass);color:#fff;font-weight:600;}
  .cd-empty{
    font-size:10.5px;color:var(--ink-soft);font-style:italic;
    padding:3px 8px;border-left:2px solid var(--hairline);line-height:1.5;
  }

  .check-box{
    background:var(--paper-dark);border-left:3px solid var(--hairline);
    padding:7px 10px;margin:0 0 6px 9px;font-size:11.5px;border-radius:0 2px 2px 0;
  }
  .check-line{display:flex;justify-content:space-between;gap:10px;padding:2px 0;}
  .check-line .mono{font-family:'IBM Plex Mono',monospace;}
  .check-detail{color:var(--ink-soft);font-size:10.5px;line-height:1.6;padding:2px 0;}

  .grad-final{border-top:2px solid var(--ink);margin-top:12px;padding-top:10px;}
  .grad-final .gf-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;}
  .grad-final .gf-row.big{font-weight:700;font-size:14px;}
  .grad-final .gf-row .mono{font-family:'IBM Plex Mono',monospace;}
  .warn-box{
    background:#FBF0E4;border-left:4px solid var(--brass);padding:9px 11px;margin-top:10px;
    font-size:11.5px;line-height:1.65;border-radius:2px;
  }
  .pass-box{background:#E9F0E6;border-left:4px solid var(--green);}
  .zero-req{display:flex;align-items:center;gap:7px;padding:5px 2px;font-size:12.5px;cursor:pointer;}
  .zero-req input{width:auto;margin:0;}

  .dual-badge{
    background:none;border:1px solid var(--hairline);color:var(--ink-soft);
    font-size:9.5px;padding:2px 5px;border-radius:9px;letter-spacing:.03em;flex:0 0 auto;
  }
  .dual-badge.on{background:var(--brass);border-color:var(--brass);color:#fff;font-weight:700;}

  .credit-summary-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px;}
  .credit-summary-table td{padding:4px 2px;border-bottom:1px solid var(--hairline);}
  .credit-summary-table td:last-child{text-align:right;font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body>

<div class="topbar">
  <div class="seal">
    <svg width="76" height="76" viewbox="0 0 76 76">
      <circle cx="38" cy="38" r="32" fill="none" stroke="#CBC2A9" stroke-width="6"/>
      <circle id="sealRing" cx="38" cy="38" r="32" fill="none" stroke="#7A2E2E" stroke-width="6" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="201"/>
    </svg>
    <div class="center">
      <div class="pct mono" id="sealPct">0%</div>
      <div class="pct-label">已規劃</div>
    </div>
  </div>
  <div class="title-block">
    <h1>學程規劃表</h1>
    <div class="sub" id="majorSub">尚未設定科系</div>
  </div>
  <div class="ledger">
    <div class="cell"><div class="num mono" id="ledgerTotal">0</div><div class="lab">應修學分</div></div>
    <div class="cell ok"><div class="num mono" id="ledgerPlanned">0</div><div class="lab">已排學分</div></div>
    <div class="cell warn"><div class="num mono" id="ledgerRemain">0</div><div class="lab">尚需學分</div></div>
  </div>
  <div class="file-actions">
    <button class="btn-ghost btn-small" id="exportBtn" title="下載目前的排課規劃為檔案">💾 匯出規劃</button>
    <button class="btn-ghost btn-small" id="importBtn" title="讀取先前匯出的規劃檔案">📂 匯入規劃</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
  </div>
</div>

<div class="layout">
  <!-- SIDEBAR -->
  <div class="sidebar">

    <div class="section-label"><span class="n">1</span>基本資料</div>
    <div class="card-box">
      <label>主修科系</label>
      <input type="text" id="majorName" placeholder="例：資訊工程學系">
      <label class="checkbox-line">
        <input type="checkbox" id="majorDongjiCheck"> 主修動機系（依113學年課表，最低畢業學分129）
      </label>
      <div id="trackWrap" style="display:none;">
        <label>選擇專業學程（四學程擇一修畢）</label>
        <select id="trackSelect">
          <option value="">— 尚未選擇 —</option>
        </select>
      </div>

      <label>額外身份（雙主修 / 輔系 / 學程）</label>
      <div class="row2">
        <select id="progType">
          <option value="雙主修">雙主修</option>
          <option value="輔系">輔系</option>
          <option value="學程">學程</option>
        </select>
        <input type="text" id="progName" placeholder="名稱，例：財金系">
      </div>
      <label>該身份畢業所需最低學分</label>
      <input type="number" id="progCredit" min="0" step="1" placeholder="例：20" value="20">
      <button class="btn-ghost" style="width:100%;margin-top:8px;" id="addProgramBtn">＋ 新增身份</button>
      <div id="programList"></div>
    </div>

    <div class="section-label"><span class="n">2</span>常用課表匯入</div>
    <div class="card-box">
      <label>選擇系所課表範本</label>
      <select id="presetSelect" class="preset-select">
        <option value="">— 請選擇 —</option>
      </select>
      <div id="presetPanel" style="display:none;">
        <div class="preset-toolbar">
          <span class="footnote" style="margin:0;" id="presetHint"></span>
          <button class="link-btn" id="presetToggleAll">全選 / 取消全選</button>
        </div>
        <div class="preset-list" id="presetList"></div>
        <button class="btn-primary" id="presetImportBtn">＋ 加入勾選課程至待排清單</button>
        <div class="preset-import-count" id="presetImportMsg"></div>
      </div>
    </div>

    <div class="section-label"><span class="n">3</span>新增課程</div>
    <div class="card-box">
      <label>課程名稱</label>
      <input type="text" id="courseName" placeholder="例：資料結構">
      <div class="row2">
        <div>
          <label>學分數</label>
          <input type="number" id="courseCredit" min="0" step="0.5" placeholder="3">
        </div>
        <div>
          <label>課程類別</label>
          <select id="courseCategory">
            <option value="主修必修">主修必修</option>
            <option value="主修選修">主修選修</option>
            <option value="校定必修">校定必修</option>
            <option value="通識">通識</option>
            <option value="專業學程">專業學程</option>
            <option value="雙主修">雙主修</option>
            <option value="輔系">輔系</option>
            <option value="學程">學程</option>
            <option value="其他">其他</option>
          </select>
        </div>
      </div>
      <div id="geTypeWrap" style="display:none;">
        <label>這門通識課屬於哪一項？</label>
        <select id="geTypeSelect"></select>
      </div>
      <button class="btn-primary" id="addCourseBtn">＋ 加入待排課程</button>
    </div>

    <div class="section-label"><span class="n">4</span>待排課程池</div>
    <input type="text" class="search-box" id="searchCourse" placeholder="搜尋課程名稱…" style="padding:8px 10px;border:1px solid var(--hairline);border-radius:2px;width:100%;font-size:12.5px;">
    <div class="pool-dropzone" id="poolZone">
      <div id="poolContainer"></div>
    </div>
    <div class="footnote">💡 拖曳課程卡片到右側學期表格，或先點選卡片、再點選目標學期格子。</div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="section-label"><span class="n">5</span>四年課表（拖曳課程至對應學期）</div>
    <div class="grid4" id="semesterGrid"></div>

    <div class="section-label" style="margin-top:24px;"><span class="n">6</span>畢業標準檢核</div>
    <div class="card-box" style="max-width:600px;">
      <div id="gradPanel"></div>
    </div>
  </div>
</div>

<script>
/* ================= DATA ================= */
const CATEGORY_COLORS = {

/* 畢業學分需求：若有勾選正式系所（majorKey），以該系表的129學分為主科底標，

   額外身份（雙主修/輔系/學程）各自的所需學分會再加總進來。 */
function majorRequiredTotal(){
  if(state.majorKey && MAJOR_REQUIREMENTS[state.majorKey]) return MAJOR_REQUIREMENTS[state.majorKey].total;
  return null; // null 代表沒有正式規定，用課程加總取代
}
function programsRequiredTotal(){
  return state.programs.filter(p=>p.enabled!==false).reduce((s,p)=>s+Number(p.requiredCredits||0),0);
}
function requiredTotalCredits(){
  const majorReq = majorRequiredTotal();
  if(majorReq===null) return totalCredits(); // fallback：沒有正式系所規定時，用已加入課程學分加總
  return majorReq + programsRequiredTotal();
}

/* ===== 畢業標準計算 =====
   學分配置優先序：物理五選二 → 專業學程 → 其餘選修。
   一門課若同時符合多個類別，其學分優先填滿前面的類別，額滿後才往後遞補。
   雙重認證（電磁學/工程光學/近代物理導論）為例外：學分在系定必修與專業學程各認列一次，
   但實際只修得一次，差額須以本系開設之選修課補足。 */
function computeGraduation(){
  const sum = list => list.reduce((s,c)=>s+Number(c.credit||0),0);
  const planned = state.courses.filter(c=>c.semester && !c.programId);
  const track = currentTrack();
  const trackList = track ? trackAllCourses(track) : [];

  // ---- 固定類別（無競合） ----
  const chineseC = planned.filter(c=>c.category==='校定必修' && c.name.includes('中文'));
  const englishC = planned.filter(c=>c.category==='校定必修' && c.name.includes('英文'));
  const geC      = planned.filter(c=>c.category==='通識');
  const physicsC = planned.filter(c=>c.category==='主修必修' && PHYSICS_PICK.includes(c.name));
  const deptCoreC= planned.filter(c=>c.category==='主修必修' && !PHYSICS_PICK.includes(c.name));

  // ---- 競合類別：可能同時滿足 物理 / 學程 / 其餘選修 ----
  const cascadeC = planned.filter(c=>
    (c.category==='主修必修' && PHYSICS_PICK.includes(c.name)) ||
    c.category==='專業學程' || c.category==='主修選修' || c.category==='其他'
  );

  const caps = {physics:6, program:15, elective:Infinity}; // 其餘選修不設上限，超修學分仍認列
  const alloc = {physics:0, program:0, elective:0};
  const detail = {};   // courseId -> {physics, program, elective}
  const remain = new Map();
  cascadeC.forEach(c=>{ remain.set(c.id, Number(c.credit||0)); detail[c.id]={physics:0,program:0,elective:0}; });

  // 雙重認證：學分額外再計入專業學程一次（不消耗該課本身的可配置學分）
  const dualC = physicsC.filter(c=>c.dualCount && DUAL_ELIGIBLE.includes(c.name));
  const dualCredits = Math.min(sum(dualC), caps.program);
  alloc.program = dualCredits;

  // 判斷一門課是否有資格填入某個類別
  function eligible(c, bucket){
    if(bucket==='physics')  return c.category==='主修必修' && PHYSICS_PICK.includes(c.name);
    if(bucket==='program')  return c.category==='專業學程' || trackList.includes(c.name);
    if(bucket==='elective') return true;   // 其餘選修為最終承接類別
    return false;
  }

  // 依優先序逐一填滿
  ['physics','program','elective'].forEach(bucket=>{
    cascadeC.forEach(c=>{
      if(!eligible(c,bucket)) return;
      const space = caps[bucket] - alloc[bucket];
      if(space<=0) return;
      const rem = remain.get(c.id);
      if(rem<=0) return;
      const take = Math.min(space, rem);
      alloc[bucket] += take;
      remain.set(c.id, rem-take);
      detail[c.id][bucket] += take;
    });
  });

  // ---- 建立各分項「實際計入學分的課程」明細 ----
  // 固定類別採依序填滿的方式，超出上限的課程會標示為未計入
  function fillFixed(list, cap){
    let filled = 0;
    const rows = list.map(c=>{
      const cr = Number(c.credit||0);
      const take = Math.max(0, Math.min(cap-filled, cr));
      filled += take;
      return {name:c.name, credit:cr, allocated:take};
    });
    return {filled, rows};
  }
  // 固定類別一律不設上限，超修學分全數認列（不會被丟棄）
  const fChinese = fillFixed(chineseC, Infinity);
  const fEnglish = fillFixed(englishC, Infinity);
  const fGe      = fillFixed(geC, Infinity);
  const fDept    = fillFixed(deptCoreC, Infinity);

  // 競合類別依實際配置結果列出
  function fromDetail(bucket){
    return cascadeC
      .filter(c=>detail[c.id][bucket] > 0)
      .map(c=>({name:c.name, credit:Number(c.credit||0), allocated:detail[c.id][bucket]}));
  }
  const contributors = {
    chinese: fChinese.rows,
    english: fEnglish.rows,
    ge:      fGe.rows,
    deptCore:fDept.rows,
    physics: fromDetail('physics'),
    program: fromDetail('program'),
    elective:fromDetail('elective'),
  };
  // 雙重認證的課程額外列進專業學程
  dualC.forEach(c=>{
    contributors.program.unshift({name:c.name, credit:Number(c.credit||0),
      allocated:Number(c.credit||0), dual:true});
  });

  const counted = {
    chinese: fChinese.filled,
    english: fEnglish.filled,
    ge:      fGe.filled,
    deptCore:fDept.filled,
    physics: alloc.physics,
    program: alloc.program,
    elective:alloc.elective,
  };
  const targets = {chinese:2, english:8, ge:20, deptCore:58, physics:6, program:15, elective:20};
  const raw = {
    chinese:sum(chineseC), english:sum(englishC), ge:sum(geC),
    deptCore:sum(deptCoreC), physics:sum(physicsC),
    program:alloc.program, elective:alloc.elective,
  };

  const countedTotal = Object.keys(counted).reduce((s,k)=>s+counted[k],0);
  const actualCredits = sum(planned);
  const shortfall = Math.max(0, 129 - actualCredits);
  const unallocated = cascadeC.filter(c=>remain.get(c.id)>0);

  // ---- 物理五選二：門數檢核 ----
  const physicsCheck = {
    taken: physicsC.map(c=>c.name),
    count: physicsC.length,
    need: 2,
    met: physicsC.length >= 2,
  };

  // ---- 專業學程：門數與核心課程檢核 ----
  let trackCheck = null;
  if(track){
    const coreTaken = track.core.filter(n=> planned.some(c=>c.name===n));
    const coreMissing = track.core.filter(n=> !planned.some(c=>c.name===n));
    const elecTaken = planned.filter(c=>
      (track.electivesUG.includes(c.name) || track.electivesGrad.includes(c.name))
      && !track.core.includes(c.name)
    ).map(c=>c.name);
    const totalCourses = coreTaken.length + elecTaken.length;
    trackCheck = {
      label:track.label,
      coreTaken, coreMissing, elecTaken,
      coreMet: coreTaken.length>=3,
      elecMet: elecTaken.length>=2,
      totalCourses,
      totalMet: totalCourses>=5,
      allMet: coreTaken.length>=3 && elecTaken.length>=2 && totalCourses>=5,
    };
  }

  // ---- 核心通識四向度：每一向度至少一門 ----
  const geDims = GE_TYPES.filter(t=>t.core).map(t=>{
    const list = geC.filter(c=>c.geType===t.key);
    return {key:t.key, short:t.short, count:list.length,
            credits:sum(list), names:list.map(c=>c.name), met:list.length>=1};
  });
  const geGeneral = geC.filter(c=>c.geType==='general');
  const geUnset   = geC.filter(c=>!c.geType);
  const geCheck = {
    dims: geDims,
    dimsMet: geDims.every(d=>d.met),
    coreCourses: geDims.reduce((s,d)=>s+d.count,0),
    coreCredits: geDims.reduce((s,d)=>s+d.credits,0),
    generalCredits: sum(geGeneral),
    unset: geUnset.map(c=>c.name),
    totalCredits: sum(geC),
    totalMet: sum(geC) >= 20,
  };

  return {raw, targets, counted, countedTotal, actualCredits, contributors, geCheck,
          dualCredits, dualC, shortfall, detail, cascadeC, unallocated,
          physicsCheck, trackCheck};
}

    : '尚未設定科系';

  const total = requiredTotalCredits(), planned = plannedCredits(), remain = Math.max(total-planned,0);
  document.getElementById('ledgerTotal').textContent = total;
  document.getElementById('ledgerPlanned').textContent = planned;
  document.getElementById('ledgerRemain').textContent = remain;

  const pct = total > 0 ? Math.min(planned/total,1) : 0;
  const circumference = 201; // 2*pi*32 approx
  document.getElementById('sealRing').setAttribute('stroke-dashoffset', circumference*(1-pct));
  document.getElementById('sealPct').textContent = Math.round(pct*100) + '%';
}

/* ================= RENDER: PROGRAM LIST ================= */
function renderPrograms(){
  const el = document.getElementById('programList');
  el.innerHTML = '';
  state.programs.forEach(p=>{
    if(p.enabled === undefined) p.enabled = true;
    const div = document.createElement('div');
    div.className = 'program-item' + (p.enabled ? '' : ' disabled');
    div.innerHTML = `
      <label style="display:flex;align-items:flex-start;gap:7px;cursor:pointer;flex:1;">
        <input type="checkbox" data-pid="${p.id}" class="prog-toggle" ${p.enabled ? 'checked' : ''} style="margin-top:2px;">
        <span><span class="tag" style="background:${CATEGORY_COLORS[p.type]}">${p.type}</span> ${p.name}
          <span class="sub" style="display:block;color:var(--ink-soft);font-size:10px;margin-top:2px;">所需 ${p.requiredCredits||0} 學分${p.enabled ? '' : '（已停用，不計入畢業學分）'}</span>
        </span>
      </label>
      <button class="del-x" data-pid="${p.id}" title="刪除">✕</button>`;
    div.querySelector('.prog-toggle').addEventListener('change', e=>{
      p.enabled = e.target.checked;
      renderAll();
    });
    div.querySelector('.del-x').addEventListener('click', ()=>{
      state.programs = state.programs.filter(x=>x.id!==p.id);
      // detach courses tied to this program (keep course, clear link) or remove entirely? remove entirely since they belong to this identity
      state.courses = state.courses.filter(c=>c.programId!==p.id);
      renderAll();
    });
    el.appendChild(div);
  });
}

/* 課程類別若為雙主修/輔系/學程，自動歸屬到同類型的身份（取第一個） */
function autoProgramId(category){

/* ================= PRESET COURSE IMPORT ================= */
function populatePresetSelect(){
  const sel = document.getElementById('presetSelect');

}

function renderPresetPanel(){
  const key = document.getElementById('presetSelect').value;
  const panel = document.getElementById('presetPanel');
  const list = document.getElementById('presetList');
  document.getElementById('presetImportMsg').textContent = '';
  if(!key){ panel.style.display='none'; return; }
  panel.style.display = 'block';
  const preset = DEPARTMENT_PRESETS[key];
  document.getElementById('presetHint').textContent = `共 ${preset.groups.reduce((s,g)=>s+g.items.length,0)} 門課程，勾選後可批次加入`;
  list.innerHTML = '';
  preset.groups.forEach((group, gi)=>{
    const gTitle = document.createElement('div');
    gTitle.className = 'preset-group-title';
    gTitle.style.background = CATEGORY_COLORS[group.items[0].category] || '#6B6558';
    gTitle.textContent = group.title;
    list.appendChild(gTitle);
    group.items.forEach((item, ii)=>{
      const row = document.createElement('label');
      row.className = 'preset-row';
      const already = state.courses.some(c=>c.name===item.name);
      row.innerHTML = `
        <input type="checkbox" data-gi="${gi}" data-ii="${ii}" ${already?'disabled':''}>
        <div style="flex:1;">
          <div class="p-name">${item.name}${already?'　<span style="color:var(--ink-soft);font-weight:400;">（已在清單中）</span>':''}</div>
          ${item.note ? `<div class="p-note">${item.note}</div>` : ''}
        </div>
        <div class="p-credit">${item.credit} 學分</div>`;
      list.appendChild(row);
    });
  });
}

function setupPresetEvents(){
  document.getElementById('presetSelect').addEventListener('change', renderPresetPanel);

  document.getElementById('presetToggleAll').addEventListener('click', ()=>{
    const boxes = [...document.querySelectorAll('#presetList input[type=checkbox]:not(:disabled)')];
    const allChecked = boxes.every(b=>b.checked);
    boxes.forEach(b=> b.checked = !allChecked);
  });

  document.getElementById('presetImportBtn').addEventListener('click', ()=>{
    const key = document.getElementById('presetSelect').value;
    if(!key) return;
    const preset = DEPARTMENT_PRESETS[key];
    const boxes = [...document.querySelectorAll('#presetList input[type=checkbox]:checked:not(:disabled)')];
    let added = 0;
    boxes.forEach(b=>{
      const item = preset.groups[b.dataset.gi].items[b.dataset.ii];
      if(state.courses.some(c=>c.name===item.name)) return; // safety dedupe
      state.courses.push({ id:newId(), name:item.name, credit:item.credit, category:item.category, programId:null, geType:item.geType||null, semester:null });
      added++;
    });
    document.getElementById('presetImportMsg').textContent = added>0 ? `已加入 ${added} 門課程至待排清單。` : '請先勾選要加入的課程。';
    renderAll();
    renderPresetPanel(); // refresh disabled state for already-added items
  });
}

/* ================= RENDER: COURSE POOL ================= */
function renderPool(){
  const container = document.getElementById('poolContainer');
  container.innerHTML = '';
  const search = document.getElementById('searchCourse').value.trim().toLowerCase();
  const unassigned = state.courses.filter(c=>!c.semester && (!search || c.name.toLowerCase().includes(search)));

  if(unassigned.length===0){
    container.innerHTML = '<div class="empty-note">目前沒有待排課程。</div>';
    return;
  }
  const groups = {};
  unassigned.forEach(c=>{ (groups[c.category] = groups[c.category]||[]).push(c); });

  Object.keys(groups).forEach(cat=>{
    const g = document.createElement('div');
    g.className = 'pool-group';
    g.innerHTML = `<div class="pool-group-title"><span class="swatch" style="background:${CATEGORY_COLORS[cat]}"></span>${cat}</div>`;
    groups[cat].forEach(c=> g.appendChild(makeChip(c)) );
    container.appendChild(g);
  });
}

function makeChip(course){
  const chip = document.createElement('div');
  chip.className = 'chip' + (state.selectedChip===course.id ? ' selected' : '');
  chip.draggable = true;
  chip.dataset.id = course.id;
  chip.style.borderLeftColor = CATEGORY_COLORS[course.category] || '#6B6558';
  const subText = course.programId ? programName(course.programId)
    : (course.category==='通識' && course.geType) ? `通識 · ${geTypeLabel(course.geType)}`
    : course.category;
  const isScheduled = !!course.semester;
  const removeIcon = isScheduled ? '↩' : '✕';
  const removeTitle = isScheduled ? '移回待排課程池' : '刪除課程';
  const dualOk = DUAL_ELIGIBLE.includes(course.name) && course.category==='主修必修';
  const dualBtn = dualOk
    ? `<button class="dual-badge ${course.dualCount?'on':''}" title="雙重認證：同時計入系定必修與專業學程（畢業學分缺口須以本系選修課補足）">雙認</button>`
    : '';
  chip.innerHTML = `
    <div class="name">${course.name}<div class="sub">${subText}</div></div>
    ${dualBtn}
    <div class="credit mono">${course.credit} 學分</div>
    <button class="del-x" title="${removeTitle}">${removeIcon}</button>`;

  if(dualOk){
    chip.querySelector('.dual-badge').addEventListener('click', e=>{
      e.stopPropagation();
      course.dualCount = !course.dualCount;
      renderAll();
    });
  }

  chip.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', course.id); });
  chip.addEventListener('click', (e)=>{
    if(e.target.classList.contains('del-x') || e.target.classList.contains('dual-badge')) return;
    state.selectedChip = (state.selectedChip===course.id) ? null : course.id;
    renderAll();
  });
  chip.querySelector('.del-x').addEventListener('click', (e)=>{
    e.stopPropagation();
    if(isScheduled){
      // 已排入學期的課程：移回待排課程池，不直接刪除
      course.semester = null;
    } else {
      // 待排課程池中的課程：直接刪除
      state.courses = state.courses.filter(c=>c.id!==course.id);
    }
    if(state.selectedChip===course.id) state.selectedChip=null;
    renderAll();
  });
  return chip;
}

/* ================= RENDER: SEMESTER GRID ================= */
function renderGrid(){
  const grid = document.getElementById('semesterGrid');
  grid.innerHTML = '';
  SEMESTERS.forEach(sem=>{
    const card = document.createElement('div');
    card.className = 'sem-card';
    const inSem = state.courses.filter(c=>c.semester===sem.id);
    const credit = inSem.reduce((s,c)=>s+Number(c.credit||0),0);

    card.innerHTML = `
      <div class="sem-head"><h3>${sem.year}．${sem.term}</h3><div class="credit-badge mono">${credit} 學分</div></div>
      <div class="sem-body" data-sem="${sem.id}"></div>`;

    const body = card.querySelector('.sem-body');
    if(inSem.length===0){
      body.innerHTML = '<div class="drop-hint">拖曳或點選課程至此</div>';
    } else {
      inSem.forEach(c=>body.appendChild(makeChip(c)));
    }

    body.addEventListener('dragover', e=>{ e.preventDefault(); body.classList.add('drag-over'); });
    body.addEventListener('dragleave', ()=> body.classList.remove('drag-over'));
    body.addEventListener('drop', e=>{
      e.preventDefault(); body.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      assignCourse(id, sem.id);
    });
    body.addEventListener('click', ()=>{
      if(state.selectedChip){
        assignCourse(state.selectedChip, sem.id);
        state.selectedChip = null;
      }
    });
    grid.appendChild(card);
  });
}

function assignCourse(id, semId){
  const c = state.courses.find(x=>x.id===id);
  if(!c) return;
  c.semester = semId;
  renderAll();
}

/* pool as drop target (unassign) */
function setupPoolDrop(){
  const zone = document.getElementById('poolZone');
  zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', ()=> zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e=>{
    e.preventDefault(); zone.classList.remove('drag-over');
    const id = e.dataTransfer.getData('text/plain');
    const c = state.courses.find(x=>x.id===id);
    if(c){ c.semester = null; renderAll(); }
  });
  zone.addEventListener('click', (e)=>{
    if(e.target.closest('.chip')) return;
    if(state.selectedChip){
      const c = state.courses.find(x=>x.id===state.selectedChip);
      if(c){ c.semester = null; }
      state.selectedChip = null;
      renderAll();
    }
  });
}

/* ================= RENDER: GRADUATION PANEL ================= */
const openDetails = new Set();   // 記住哪些摺疊清單是展開的，重繪後不會收合

function renderSummary(){
  const panel = document.getElementById('gradPanel');
  const req = state.majorKey ? MAJOR_REQUIREMENTS[state.majorKey] : null;

  if(!req){
    // 未勾選正式系所：退回依課程類別加總的簡易統計
    const cats = [...new Set(state.courses.map(c=>c.category))];
    let rows = '';
    cats.forEach(cat=>{
      const list = state.courses.filter(c=>c.category===cat);
      const tot = list.reduce((s,c)=>s+Number(c.credit||0),0);
      const pl = list.filter(c=>c.semester).reduce((s,c)=>s+Number(c.credit||0),0);
      rows += `<div class="grad-row"><span class="gr-name">${cat}</span><span class="gr-num">${pl} / ${tot} 學分</span></div>`;
    });
    if(!rows) rows = '<div class="grad-row" style="color:var(--ink-soft);font-style:italic;">尚未新增課程</div>';
    panel.innerHTML = `<div class="grad-head"><span class="gh-title">學分統計</span></div>${rows}
      <div class="warn-box">勾選左側「主修動機系」後，此處會顯示完整的畢業標準檢核。</div>`;
    return;
  }

  const g = computeGraduation();
  const bar = (v,t) => {
    const pct = t>0 ? Math.min(v/t,1)*100 : 0;
    return `<span class="bar"><span class="${pct>=100?'full':''}" style="width:${pct}%"></span></span>`;
  };

  let html = `<div class="grad-head">
      <span class="gh-title">${req.label}</span>
      <span class="gh-total">最低畢業總學分 ${req.total}</span>
    </div>`;

  const chk = (ok) => ok
    ? '<span style="color:var(--green);font-weight:700;">✓ 已達成</span>'
    : '<span style="color:var(--danger);font-weight:700;">✗ 未達成</span>';

  req.blocks.forEach(block=>{
    const blockCounted = block.items.reduce((s,it)=>s+g.counted[it.key],0);
    html += `<div class="grad-block">
      <div class="grad-block-title" style="background:${block.color}">
        <span>${block.title}</span><span>${blockCounted} / ${block.target} 學分</span>
      </div>`;
    block.items.forEach(it=>{
      const val = g.counted[it.key], tgt = it.target;
      const met = val >= tgt;
      const over = (val > tgt)
        ? `<span class="gr-note" style="color:var(--green);">已超修 ${val-tgt} 學分，全數計入本項</span>` : '';
      html += `<div class="grad-row ${met?'met':''}">
        <span class="gr-name">${it.label}${it.note?`<span class="gr-note">${it.note}</span>`:''}${over}</span>
        ${bar(val,tgt)}
        <span class="gr-num">${val} / ${tgt}</span>
      </div>`;

      // ===== 摺疊清單：計入本項學分的課程 =====
      const rows = g.contributors[it.key] || [];
      const counting = rows.filter(r=>r.allocated>0);
      const excluded = rows.filter(r=>r.allocated===0);
      html += `<details class="course-detail" data-key="${it.key}" ${openDetails.has(it.key)?'open':''}>
        <summary>計入本項的課程（${counting.length} 門，共 ${val} 學分）</summary>`;
      if(counting.length===0){
        html += `<div class="cd-empty">尚無課程計入本項。</div>`;
      } else {
        counting.forEach(r=>{
          const partial = r.allocated < r.credit
            ? `<span class="cd-tag">部分計入，另 ${r.credit-r.allocated} 學分遞補至其他類別</span>` : '';
          const dualTag = r.dual ? `<span class="cd-tag dual">雙重認證</span>` : '';
          html += `<div class="cd-row">
            <span class="cd-name">${r.name}${dualTag}${partial}</span>
            <span class="cd-num">${r.allocated} 學分</span>
          </div>`;
        });
      }
      if(excluded.length){
        html += `<div class="cd-empty">未計入（本項已達上限）：${excluded.map(r=>r.name).join('、')}</div>`;
      }
      html += `</details>`;

      // ===== 通識：核心四向度檢核 =====
      if(it.key==='ge'){
        const q = g.geCheck;
        html += `<div class="check-box">
          <div class="check-line" style="font-weight:700;">
            <span>核心通識四大向度（每向度至少一門）</span>
            <span>${q.dims.filter(d=>d.met).length} / 4 向度　${chk(q.dimsMet)}</span>
          </div>`;
        q.dims.forEach(d=>{
          html += `<div class="check-line">
            <span>${d.short}</span>
            <span>${d.count ? `${d.names.join('、')}（${d.credits}學分）` : '<span style="color:var(--danger);">尚未修習</span>'}</span>
          </div>`;
        });
        html += `<div class="check-line" style="border-top:1px solid var(--hairline);margin-top:3px;padding-top:4px;">
            <span>核心通識合計</span><span>${q.coreCourses} 門 / ${q.coreCredits} 學分</span></div>
          <div class="check-line"><span>一般通識（選修通識）</span><span>${q.generalCredits} 學分</span></div>
          <div class="check-line" style="font-weight:700;">
            <span>核心＋一般合計</span><span>${q.totalCredits} / 20 學分　${chk(q.totalMet)}</span></div>`;
        if(q.unset.length){
          html += `<div class="check-detail" style="color:var(--danger);">
            尚未指定向度的通識課：${q.unset.join('、')}（不計入四向度檢核）</div>`;
        }
        html += `</div>`;
      }

      // ===== 物理五選二：門數檢核 =====
      if(it.key==='physics'){
        const p = g.physicsCheck;
        html += `<div class="check-box">
          <div class="check-line"><span>五科中已選修門數</span><span>${p.count} / ${p.need} 門　${chk(p.met)}</span></div>
          ${p.taken.length ? `<div class="check-detail">已選：${p.taken.join('、')}</div>`
                           : `<div class="check-detail">尚未選修任何物理相關課程（工程光學、電磁學、近代物理導論、普通物理一、普通物理二）</div>`}
          ${g.dualCredits>0 ? `<div class="check-detail" style="color:var(--brass);">其中 ${g.dualCredits} 學分已雙重認證至專業學程</div>` : ''}
        </div>`;
      }

      // ===== 專業學程：核心課程與門數檢核 =====
      if(it.key==='program'){
        const t = g.trackCheck;
        if(!t){
          html += `<div class="check-box"><div class="check-detail">請先於左側「基本資料」選擇要修習的專業學程，才能檢核核心課程與門數。</div></div>`;
        } else {
          html += `<div class="check-box">
            <div class="check-line" style="font-weight:700;"><span>${t.label}</span><span>${chk(t.allMet)}</span></div>
            <div class="check-line"><span>核心課程（3門必選）</span><span>${t.coreTaken.length} / 3 門　${chk(t.coreMet)}</span></div>
            <div class="check-detail">
              ${t.coreTaken.length ? `已修：${t.coreTaken.join('、')}<br>` : ''}
              ${t.coreMissing.length ? `<span style="color:var(--danger);">尚缺：${t.coreMissing.join('、')}</span>` : ''}
            </div>
            <div class="check-line"><span>選修課程（大學部或研究所，2門以上）</span><span>${t.elecTaken.length} / 2 門　${chk(t.elecMet)}</span></div>
            ${t.elecTaken.length ? `<div class="check-detail">已修：${t.elecTaken.join('、')}</div>` : ''}
            <div class="check-line"><span>學程內課程總門數（5門以上）</span><span>${t.totalCourses} / 5 門　${chk(t.totalMet)}</span></div>
          </div>`;
        }
      }
    });
    html += `</div>`;
  });

  // ===== 學分配置明細（僅顯示有跨類別遞補的課程）=====
  const cascaded = g.cascadeC.filter(c=>{
    const d = g.detail[c.id];
    return [d.physics,d.program,d.elective].filter(v=>v>0).length > 1;
  });
  if(cascaded.length){
    html += `<div class="check-box" style="margin-top:4px;">
      <div class="check-line" style="font-weight:700;"><span>學分遞補配置</span><span></span></div>
      <div class="check-detail">下列課程學分因前一類別已額滿而向後遞補（優先序：物理五選二 → 專業學程 → 其餘選修）</div>`;
    cascaded.forEach(c=>{
      const d = g.detail[c.id];
      const parts = [];
      if(d.physics>0) parts.push(`物理 ${d.physics}`);
      if(d.program>0) parts.push(`學程 ${d.program}`);
      if(d.elective>0) parts.push(`選修 ${d.elective}`);
      html += `<div class="check-line"><span>${c.name}（${c.credit}學分）</span><span class="mono">${parts.join(' ＋ ')}</span></div>`;
    });
    html += `</div>`;
  }
  if(g.unallocated.length){
    html += `<div class="check-box"><div class="check-detail" style="color:var(--brass);">
      以下課程學分因各類別皆已額滿而未認列：${g.unallocated.map(c=>c.name).join('、')}
    </div></div>`;
  }

  // ==== 總計與雙重認證缺口 ====
  html += `<div class="grad-final">
    <div class="gf-row"><span>各分項認列學分合計</span><span class="mono">${g.countedTotal} / ${req.total}</span></div>
    <div class="gf-row big"><span>實際修得學分（每門課只計一次）</span><span class="mono">${g.actualCredits} / ${req.total}</span></div>`;

  if(g.dualCredits > 0){
    html += `<div class="warn-box">
      <strong>雙重認證提醒</strong><br>
      ${g.dualC.map(c=>c.name).join('、')} 共 ${g.dualCredits} 學分同時認列為<strong>系定必修</strong>與<strong>專業學程</strong>。
      認列學分雖然增加，但實際只修得一次學分，因此畢業總學分會短少 <strong>${g.dualCredits} 學分</strong>，
      依課表備註須另修習<strong>本系開設之選修課</strong>補足。
    </div>`;
  }

  if(g.shortfall > 0){
    html += `<div class="warn-box">距離 ${req.total} 學分畢業門檻，尚需再排入 <strong>${g.shortfall} 學分</strong>的課程。</div>`;
  } else {
    html += `<div class="warn-box pass-box">學分總數已達 ${req.total} 學分畢業門檻，請再確認各分項是否皆已滿足。</div>`;
  }

  // ==== 0學分必修項目 ====
  html += `<div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--hairline);">
    <div style="font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:5px;">0 學分必修項目（請自行確認）</div>`;
  req.zeroCredit.forEach(z=>{
    html += `<label class="zero-req">
      <input type="checkbox" class="zero-check" data-key="${z.key}" ${state.zeroReq[z.key]?'checked':''}> ${z.label}
    </label>`;
  });
  html += `</div>`;

  // ==== 額外身份 ====
  if(state.programs.length){
    html += `<div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--hairline);">
      <div style="font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:5px;">額外身份</div>`;
    state.programs.forEach(p=>{
      const list = state.courses.filter(c=>c.programId===p.id && c.semester);
      const pl = list.reduce((s,c)=>s+Number(c.credit||0),0);
      const off = p.enabled===false;
      const met = !off && pl >= (p.requiredCredits||0);
      html += `<div class="grad-row ${met?'met':''}" ${off?'style="color:var(--ink-soft);font-style:italic;"':''}>
        <span class="gr-name">${p.type}：${p.name}${off?'（已停用）':''}</span>
        ${off?'':bar(pl, p.requiredCredits||0)}
        <span class="gr-num">${pl} / ${p.requiredCredits||0}</span>
      </div>`;
    });
    html += `<div class="gf-row" style="font-weight:700;padding-top:8px;border-top:2px solid var(--ink);margin-top:6px;">
      <span>畢業總計（含額外身份）</span><span class="mono">${plannedCredits()} / ${requiredTotalCredits()} 學分</span></div></div>`;
  }

  panel.innerHTML = html;

  panel.querySelectorAll('.course-detail').forEach(d=>{
    d.addEventListener('toggle', ()=>{
      if(d.open) openDetails.add(d.dataset.key);
      else openDetails.delete(d.dataset.key);
    });
  });

  panel.querySelectorAll('.zero-check').forEach(cb=>{
    cb.addEventListener('change', e=>{
      state.zeroReq[e.target.dataset.key] = e.target.checked;
    });
  });
}

/* ================= MASTER RENDER ================= */
function renderAll(){
  renderHeader();
  renderPrograms();
  renderPool();
  renderGrid();
  renderSummary();
}

/* ================= EVENTS: FORMS ================= */
document.getElementById('majorName').addEventListener('input', e=>{
  state.major = e.target.value; renderHeader();
});

document.getElementById('majorDongjiCheck').addEventListener('change', e=>{
  if(e.target.checked){
    state.majorKey = 'dongji113';
    if(!document.getElementById('majorName').value.trim()){
      document.getElementById('majorName').value = '動機工程學系';
      state.major = '動機工程學系';
    }
  } else {
    state.majorKey = null;
  }
  document.getElementById('trackWrap').style.display = e.target.checked ? 'block' : 'none';
  renderAll();
});

function populateTrackSelect(){
  const sel = document.getElementById('trackSelect');
  Object.keys(PROGRAM_TRACKS).forEach(k=>{
    const o = document.createElement('option');
    o.value = k; o.textContent = PROGRAM_TRACKS[k].label;
    sel.appendChild(o);
  });
  sel.addEventListener('change', e=>{
    state.programTrack = e.target.value || null;
    renderAll();
  });
}

document.getElementById('addProgramBtn').addEventListener('click', ()=>{
  const type = document.getElementById('progType').value;
  const nameInput = document.getElementById('progName');
  const creditInput = document.getElementById('progCredit');
  const name = nameInput.value.trim();
  if(!name){ nameInput.focus(); return; }
  const requiredCredits = parseFloat(creditInput.value) || 0;
  state.programs.push({id:'p'+(uid++), type, name, requiredCredits, enabled:true});
  nameInput.value = ''; creditInput.value = '20';
  renderAll();
});

document.getElementById('courseCategory').addEventListener('change', refreshGeTypeVisibility);

document.getElementById('addCourseBtn').addEventListener('click', ()=>{
  const nameEl = document.getElementById('courseName');
  const creditEl = document.getElementById('courseCredit');
  const catEl = document.getElementById('courseCategory');

  const name = nameEl.value.trim();
  const credit = parseFloat(creditEl.value);
  const category = catEl.value;

  if(!name){ nameEl.focus(); return; }
  if(isNaN(credit) || credit<0){ creditEl.focus(); return; }

  const programId = autoProgramId(category);
  if(PROGRAM_CATEGORIES.includes(category) && !programId){
    alert(`請先於上方「基本資料」新增一個「${category}」身份`);
    return;
  }

  const geType = (category==='通識') ? document.getElementById('geTypeSelect').value : null;

  state.courses.push({ id:newId(), name, credit, category, programId, geType, semester:null });
  nameEl.value=''; creditEl.value='';
  nameEl.focus();
  renderAll();
});

document.getElementById('searchCourse').addEventListener('input', renderPool);

/* enter-key convenience */
['courseName','courseCredit'].forEach(id=>{
  document.getElementById(id).addEventListener('keydown', e=>{
    if(e.key==='Enter') document.getElementById('addCourseBtn').click();
  });
});
document.getElementById('progName').addEventListener('keydown', e=>{
  if(e.key==='Enter') document.getElementById('addProgramBtn').click();
});

/* ================= EXPORT / IMPORT PLAN ================= */
function exportPlan(){
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    major: state.major,
    majorKey: state.majorKey,
    programTrack: state.programTrack,
    programs: state.programs,
    courses: state.courses,
    zeroReq: state.zeroReq,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const datePart = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `課表規劃_${state.major || '未命名'}_${datePart}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importPlan(file){
  const reader = new FileReader();
  reader.onload = e => {
    let data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ alert('這個檔案不是有效的規劃檔（JSON 格式錯誤）。'); return; }

    if(!data || !Array.isArray(data.courses) || !Array.isArray(data.programs)){
      alert('這個檔案的格式看起來不是本網站匯出的規劃檔。');
      return;
    }
    if(state.courses.length > 0 || state.programs.length > 0){
      const ok = confirm('讀取這個檔案會覆蓋目前畫面上的所有課程與身份設定，確定要繼續嗎？');
      if(!ok) return;
    }

    state.major = data.major || '';
    state.majorKey = data.majorKey || null;
    state.programTrack = data.programTrack || null;
    state.programs = data.programs.map(p=>({ enabled:true, requiredCredits:0, ...p }));
    state.courses = data.courses.map(c=>({ semester:null, programId:null, dualCount:false, ...c }));
    state.zeroReq = data.zeroReq || {};
    state.selectedChip = null;

    // 重新設定uid計數器，避免之後新增的課程/身份與匯入的ID重複
    let maxNum = 0;
    [...state.programs, ...state.courses].forEach(item=>{
      const m = String(item.id||'').match(/(\d+)$/);
      if(m) maxNum = Math.max(maxNum, parseInt(m[1],10));
    });
    uid = maxNum + 1;

    document.getElementById('majorName').value = state.major;
    document.getElementById('majorDongjiCheck').checked = (state.majorKey === 'dongji113');
    document.getElementById('trackWrap').style.display = (state.majorKey === 'dongji113') ? 'block' : 'none';
    document.getElementById('trackSelect').value = state.programTrack || '';

    renderAll();
  };
  reader.readAsText(file);
}

document.getElementById('exportBtn').addEventListener('click', exportPlan);
document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e=>{
  if(e.target.files && e.target.files[0]) importPlan(e.target.files[0]);
  e.target.value = ''; // 允許重複選取同一個檔案
});

/* ================= INIT ================= */
setupPoolDrop();
populatePresetSelect();
populateTrackSelect();
populateGeTypeSelect();
refreshGeTypeVisibility();
setupPresetEvents();
renderAll();
</script>
